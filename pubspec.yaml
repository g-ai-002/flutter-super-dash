name: super_dash
description: 横版跑酷游戏 - 支持 Android、Windows 与 Web 三平台
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: 1.38.2
  flame_behaviors: 1.4.0
  flame_tiled: ^1.20.2
  leap: 0.7.0
  audioplayers: 6.8.1
  provider: 6.1.5+1
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  path: 1.9.1
  window_manager: 0.5.2
  bloc: 9.2.1
  flutter_bloc: 9.1.1
  equatable: 3.0.0
  file_selector: 1.1.0
  flow_builder: 0.1.0
  intl: 0.20.3
  logging: 1.3.0
  ordered_set: 8.0.1
  pathxp: 0.4.0
  share_plus: 13.3.1
  url_launcher: 6.3.3
  json_annotation: 4.12.0
  app_ui:
    path: packages/app_ui
  leaderboard_repository:
    path: packages/leaderboard_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: 10.0.0
  flame_test: 2.3.1
  mocktail: 1.0.5
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/map/
    - assets/map/anim/
    - assets/map/tiles/
    - assets/map/objects/
    - assets/music/
    - assets/sfx/
